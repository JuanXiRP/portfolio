name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Repository name doubles as the sub-path GitHub Pages serves the site from.
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Pages runs Jekyll by default, which would drop the `_next` folder.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
